# Catalogue de sources proposées à l'import (app, interface web). Rien n'est collecté sans
# l'accord de l'utilisateur. Lu par le moteur depuis la branche main du dépôt (au plus une fois
# par jour), avec une copie intégrée au binaire pour fonctionner hors ligne.
#
# Une entrée par source ; chaque flux est vérifié avant d'entrer ici (réponse 200, RSS / Atom).
version = 1

[themes]
actualites = "Actualités"
sciences = "Sciences"
technologie = "Technologie"
developpement = "Développement"

