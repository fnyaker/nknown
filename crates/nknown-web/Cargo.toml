[package]
name = "nknown-web"
description = "Interface web de NKnown (Leptos, WebAssembly), servie par nknown-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nknown-api.workspace = true
nknown-graph.workspace = true
leptos = { version = "0.8.3", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Même version que l'outil wasm-bindgen installé (build.sh).
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlInputElement", "Request", "RequestInit",
    "RequestCredentials", "Response", "Headers", "ReadableStream",
    "ReadableStreamDefaultReader", "KeyboardEvent", "MouseEvent", "WheelEvent",
    "Storage",
] }

[lints]
workspace = true
