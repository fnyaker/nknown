[package]
name = "nknown-neural"
description = "Couche 3 de NKnown : analyseur syntaxique neuronal (XLM-RoBERTa + biaffine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nknown-core.workspace = true
nknown-nlp.workspace = true
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
# Traduction (modèles Marian / OPUS-MT) sur CPU.
candle-transformers = "=0.11.1"
# Sans onig ni esaxx (C/C++) : Rust pur.
fst = "0.4"
# Normalisation précompilée de SentencePiece (Rust pur), celle qu'utilise `tokenizers`.
spm_precompiled = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.7"
# Poids f32 en mémoire pour la version GPU, depuis les poids quantifiés distribués.
safetensors = "0.8"
burn = { version = "=0.22.1", default-features = false, features = ["std", "vulkan", "autodiff", "optim", "safetensors"], optional = true }

[dev-dependencies]
# Référence pour vérifier que notre tokeniseur découpe exactement pareil.
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[features]
# Moteur GPU via Vulkan (burn + wgpu), en plus du moteur CPU (candle).
vulkan = ["dep:burn"]

[lints]
workspace = true
