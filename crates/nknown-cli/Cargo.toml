[package]
name = "nknown-cli"
description = "Interface en ligne de commande de NKnown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nknown"
path = "src/main.rs"

[dependencies]
nknown-core.workspace = true
nknown-nlp.workspace = true
nknown-sources.workspace = true
nknown-engine.workspace = true
nknown-neural = { workspace = true, optional = true }
nknown-service.workspace = true
nknown-server.workspace = true

[features]
default = ["neural", "vulkan", "plasma"]
# Intégration KDE Plasma du démon (KRunner, notifications).
plasma = ["nknown-server/plasma"]
# Couche 3 (candle, XLM-R) : dépendances lourdes, désactivable.
neural = ["dep:nknown-neural", "nknown-service/neural", "nknown-server/neural"]
# Couche 3 aussi sur GPU via Vulkan (burn).
vulkan = ["neural", "nknown-neural/vulkan", "nknown-service/vulkan", "nknown-server/vulkan"]

[lints]
workspace = true
