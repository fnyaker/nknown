[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.5"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
nknown-core = { path = "crates/nknown-core" }
nknown-nlp = { path = "crates/nknown-nlp" }
nknown-sources = { path = "crates/nknown-sources" }
nknown-engine = { path = "crates/nknown-engine" }
nknown-neural = { path = "crates/nknown-neural" }
nknown-api = { path = "crates/nknown-api" }
nknown-graph = { path = "crates/nknown-graph" }
nknown-server = { path = "crates/nknown-server" }
nknown-service = { path = "crates/nknown-service", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Binaires distribués (paquets, archives) : sans symboles, optimisés à l'édition de liens.
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
