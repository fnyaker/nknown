name: CI

on:
  push:
  pull_request:

# Dépôt privé : minutes comptées. Les crates neuronales (candle, burn) sont exclues :
# longues à compiler, et testées localement.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p nknown-core -p nknown-nlp -p nknown-engine -p nknown-sources --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p nknown-core -p nknown-nlp -p nknown-engine -p nknown-sources
